name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0), without the leading v'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Casper.app (macOS, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-macos-15-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-macos-15-

      - name: Install dependencies
        run: brew install libgit2 pkgconf dylibbundler
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'

      - name: Derive version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHORT_VERSION="$INPUT_VERSION"
            TAG="v${SHORT_VERSION}"
          else
            TAG="$REF_NAME"
            SHORT_VERSION="${TAG#v}"
          fi
          if ! printf '%s' "$SHORT_VERSION" | grep -Eq '^[0-9A-Za-z.+-]+$'; then
            echo "error: invalid version '$SHORT_VERSION'" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "short=$SHORT_VERSION"
            echo "bundle=$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"

      # A tag can point at any commit, including one CI never ran. Sparkle
      # auto-updates every installed copy to whatever this job publishes, so the
      # suite runs here too rather than trusting that the tagged SHA was green.
      - name: Test
        run: make test
        env:
          SWIFT_BACKTRACE: enable=yes

      - name: Bundle & package
        env:
          SHORT: ${{ steps.version.outputs.short }}
          BUNDLE: ${{ steps.version.outputs.bundle }}
        run: make dist SHORT_VERSION="$SHORT" BUNDLE_VERSION="$BUNDLE"

      # Casper is ad-hoc signed, so this EdDSA signature is the only thing that
      # proves an update came from us — a missing secret must fail the release,
      # never silently publish a feed every installed copy would reject.
      - name: Sign the archive (Sparkle EdDSA)
        id: sign
        env:
          SHORT: ${{ steps.version.outputs.short }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "error: the SPARKLE_PRIVATE_KEY repository secret is not set" >&2
            echo "       (base64 EdDSA private seed — see" \
                 ".claude/project-memory/references/sparkle-eddsa-key.md)" >&2
            exit 1
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIGN_UPDATE="$(Scripts/sparkle-tool.sh sign_update)"
          SIG="$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" -p "dist/Casper-${SHORT}-arm64.zip")"
          "$SIGN_UPDATE" --ed-key-file "$KEY_FILE" --verify "dist/Casper-${SHORT}-arm64.zip" "$SIG"
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"

      - name: Generate appcast
        env:
          SHORT: ${{ steps.version.outputs.short }}
          BUNDLE: ${{ steps.version.outputs.bundle }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNATURE: ${{ steps.sign.outputs.signature }}
        run: |
          ZIP="dist/Casper-${SHORT}-arm64.zip"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Casper-${SHORT}-arm64.zip"
          LEN="$(stat -f%z "$ZIP")"
          Scripts/update-appcast.sh "$SHORT" "$BUNDLE" "$URL" "$LEN" "$SIGNATURE"

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.version.outputs.short }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ZIP="dist/Casper-${SHORT}-arm64.zip"
          SUM="dist/Casper-${SHORT}-arm64.zip.sha256"
          # The shipped binary is stripped; this dSYM is what symbolicates the
          # crash reports users send back for this exact release.
          DSYM="dist/Casper-${SHORT}-arm64.dSYM.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SUM" "$DSYM" appcast.xml --clobber
          else
            gh release create "$TAG" "$ZIP" "$SUM" "$DSYM" appcast.xml \
              --title "Casper ${SHORT}" \
              --notes-file Packaging/release-notes.md
          fi

      - name: Upload build artifacts (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Casper-${{ steps.version.outputs.short }}-arm64
          path: |
            dist/Casper-${{ steps.version.outputs.short }}-arm64.zip
            dist/Casper-${{ steps.version.outputs.short }}-arm64.zip.sha256
            dist/Casper-${{ steps.version.outputs.short }}-arm64.dSYM.zip
            appcast.xml
