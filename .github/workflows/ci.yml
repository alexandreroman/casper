name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Print toolchain
        run: swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-macos-15-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-macos-15-

      - name: Install libgit2
        run: brew install libgit2 pkgconf
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'

      - name: Build
        run: swift build

      # Retry once: `swift test` rarely aborts with SIGABRT (signal 6) mid-suite
      # on the headless runner during AppKit/NSEvent-heavy tests, with no real
      # test failure. Not reproducible locally; retry is the accepted mitigation.
      - name: Test
        run: |
          for attempt in 1 2; do
            echo "swift test (attempt $attempt/2)"
            if swift test; then
              exit 0
            fi
          done
          exit 1
