name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, arm64)
    # Both ends of the supported range. macos-15 is the deployment target's own
    # floor and the leg that must stay green; macos-26 is what development runs
    # on, and the pair is what catches an OS-dependent difference in either
    # direction — TextKit's cold-layout height estimates differ between the two,
    # which a single leg only ever shows as a failure on the *other* machine.
    runs-on: ${{ matrix.os }}
    strategy:
      # One leg's failure must not cancel the other: which of the two fails is
      # the diagnosis.
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Print toolchain
        run: swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ matrix.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ matrix.os }}-

      - name: Install libgit2
        run: brew install libgit2 pkgconf
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'

      - name: Build
        run: swift build

      # ReportCrash doesn't run on this headless runner (no GUI login session),
      # so no crash report ever lands under ~/Library/Logs/DiagnosticReports on
      # a test-process abort. Ask the Swift runtime itself to print a backtrace
      # to stderr instead — cheap defense-in-depth for any future crash.
      - name: Test
        run: swift test
        env:
          SWIFT_BACKTRACE: enable=yes
