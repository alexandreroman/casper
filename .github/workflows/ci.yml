name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Print toolchain
        run: swift --version

      - name: Install libgit2
        run: brew install libgit2 pkgconf

      - name: Build
        run: swift build

      - name: Test
        run: swift test
