name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Print toolchain
        run: swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-macos-15-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-macos-15-

      - name: Install libgit2
        run: brew install libgit2 pkgconf
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'

      - name: Build
        run: swift build

      # DIAGNOSTIC: `swift test` reliably aborts with SIGABRT (signal 6) mid-suite
      # on the headless runner, always at CasperUITests.WorkspaceShortcutKeyMonitorTests.
      # No crash report shows up under ~/Library/Logs/DiagnosticReports because
      # ReportCrash isn't running without a GUI login session, so ask the Swift
      # runtime itself to print a backtrace to stderr on crash.
      - name: Test
        run: swift test
        env:
          SWIFT_BACKTRACE: enable=yes,cleanupOnSigterm=yes,interactive=no

      - name: Dump crash reports (diagnostic)
        if: always()
        run: |
          echo "--- ~/Library/Logs/DiagnosticReports ---"
          ls -la ~/Library/Logs/DiagnosticReports 2>&1 || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips ~/Library/Logs/DiagnosticReports/*.crash; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
          done
          echo "--- log show (last 10m, process CasperPackageTests) ---"
          log show --last 10m --predicate 'process CONTAINS "CasperPackageTests" OR process CONTAINS "swift"' --style syslog 2>&1 | tail -500 || true
